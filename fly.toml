app = "duolingo-backend"
primary_region = "iad"

[build]
builder = "paketobuildpacks/builder:base"

[deploy]
release_command = "bash start.sh"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1